[package]
name = "cellule-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Typed application composition for Cellule"

[dependencies]
blake3.workspace = true
cellule-runtime.workspace = true

[dev-dependencies]
cellule-ltx = { workspace = true, features = ["replica"] }
cellule-store.workspace = true
ed25519-dalek.workspace = true
object_store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
