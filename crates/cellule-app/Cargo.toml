[package]
name = "cellule-app"
autoexamples = false
# Integration modules live directly in tests/; only these two files are targets.
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Dependency-light author API for Cellule applications"

[dependencies]
blake3.workspace = true
cellule-runtime.workspace = true

[dev-dependencies]
async-trait.workspace = true
bytes.workspace = true
cellule-host.workspace = true
cellule-runtime = { workspace = true, features = ["test-support"] }
cellule-ltx = { workspace = true, features = ["replica"] }
cellule-store.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
object_store.workspace = true
prost.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-util.workspace = true
tracing-subscriber = "0.3"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "sql"
path = "examples/sql.rs"

[[example]]
name = "blob"
path = "examples/blob.rs"

[[example]]
name = "workflow"
path = "examples/workflow.rs"

[[example]]
name = "schedules"
path = "examples/schedules.rs"
