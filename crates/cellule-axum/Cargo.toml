[package]
name = "cellule-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Axum extractors and outcome-aware HTTP responses for Cellule applications"

[features]
default = []
openapi = ["dep:utoipa", "dep:utoipa-axum"]

[dependencies]
axum = { workspace = true, features = ["json"] }
cellule-app.workspace = true
cellule-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
utoipa = { version = "6", optional = true, features = ["uuid", "axum_extras"] }
utoipa-axum = { version = "0.3", optional = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
blake3.workspace = true
cellule-ltx = { workspace = true, features = ["replica"] }
cellule-store.workspace = true
object_store.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "integration"
path = "examples/integration/main.rs"
required-features = ["openapi"]
