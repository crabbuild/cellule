<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cellule API documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.32.0/swagger-ui.css" crossorigin="anonymous">
  </head>
  <body>
    <div id="swagger-ui">
      <p>Loading API documentation. You can also read the <a href="/openapi.json">OpenAPI specification</a>.</p>
    </div>
    <noscript>Enable JavaScript to use the interactive API documentation.</noscript>
    <script src="https://unpkg.com/swagger-ui-dist@5.32.0/swagger-ui-bundle.js" crossorigin="anonymous"></script>
    <script>
      if (typeof SwaggerUIBundle === "function") {
        SwaggerUIBundle({
          url: "/openapi.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          displayOperationId: true,
          displayRequestDuration: true,
          validatorUrl: null,
          persistAuthorization: false,
        });
      }
    </script>
  </body>
</html>
