[package]
name = "cellule-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Embedded Cell runtime for distributed Rust applications"

[[bin]]
name = "cell_movement_probe"
path = "src/bin/cell_movement_probe.rs"
required-features = ["process-test-support"]

[features]
default = []
process-test-support = ["cellule-store/test-support"]

[dependencies]
blake3.workspace = true
bytes.workspace = true
cellule-store.workspace = true
cellule-ltx = { workspace = true, features = ["replica"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
object_store.workspace = true
prost.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
async-trait.workspace = true
cellule-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
