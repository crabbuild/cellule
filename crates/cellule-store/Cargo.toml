[package]
name = "cellule-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provider-neutral object-store transport for Cellule."

[lib]
name = "cellule_store"
path = "src/lib.rs"

[features]
default = []
test-support = ["dep:fs4"]

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
cellule-types.workspace = true
futures-util = { workspace = true }
fs4 = { version = "0.13", optional = true }
hyper = "1"
object_store = { workspace = true, features = [
    "aws",
    "gcp",
    "azure",
    "fs",
] }
rand = "0.9"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = "2.5"

[dev-dependencies]
tempfile = { workspace = true }
