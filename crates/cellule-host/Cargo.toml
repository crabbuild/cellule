[package]
name = "cellule-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provider-neutral Cell node lifecycle facade"

[dependencies]
blake3.workspace = true
cellule-app.workspace = true
cellule-runtime.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
bytes.workspace = true
cellule-store.workspace = true
ed25519-dalek.workspace = true
object_store.workspace = true
rusqlite.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "fleet_operations"
path = "examples/fleet_operations/main.rs"
