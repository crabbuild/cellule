[package]
name = "cellule-peer-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Authenticated HTTP transport and pinned mTLS for Cellule peers"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
cellule-runtime.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
futures-util.workspace = true
http = "1"
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-rustls = "0.26"
tracing.workspace = true
url = "2"
x509-cert = "0.2.5"

[dev-dependencies]
cellule-store = { workspace = true, features = ["test-support"] }
object_store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
