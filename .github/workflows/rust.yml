name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    services:
      rustfs:
        image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
        env:
          # Disposable CI fixture credentials; never use them for a deployment.
          RUSTFS_ACCESS_KEY: cellule-ci
          RUSTFS_SECRET_KEY: cellule-integration-fixture
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOG_DIRECTORY: /data/logs
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/health/ready"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install contract validation tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler sqlite3
      - name: Format
        run: cargo fmt --all --check
      - name: Architecture boundaries
        run: |
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/check-boundaries.py
          python3 scripts/check-module-layout.py
          python3 scripts/check-doc-rust-fences.py
          python3 scripts/check-doc-links.py
      - name: Release metadata
        run: python3 scripts/release.py check
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Documentation links
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Compile website Rust examples
        run: python3 scripts/check-web-rust-examples.py
      - name: Run SQL example
        run: cargo run -p cellule-app --example sql --locked
      - name: Run Blob example
        run: cargo run -p cellule-app --example blob --locked
      - name: Run basic example
        run: cargo run -p cellule-app --example basic --locked
      - name: Create isolated RustFS bucket
        env:
          AWS_ACCESS_KEY_ID: cellule-ci
          AWS_SECRET_ACCESS_KEY: cellule-integration-fixture
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket cellule-ci
      - name: Run balanced three-process storefront smoke
        env:
          AWS_ACCESS_KEY_ID: cellule-ci
          AWS_SECRET_ACCESS_KEY: cellule-integration-fixture
          AWS_EC2_METADATA_DISABLED: "true"
          CELLULE_TEST_ENDPOINT: http://127.0.0.1:9000
          CELLULE_TEST_BUCKET: cellule-ci
          CELLULE_TEST_PREFIX: reference-smoke
          CELLULE_PERF_ITERATIONS: "1"
        run: |
          smoke_test=process_performance::reference_balanced_three_process_fleet_end_to_end_performance
          cargo test -p cellule-app --test integration "$smoke_test" \
            --locked -- --ignored --exact --list | grep -Fx "$smoke_test: test"
          cargo test -p cellule-app --test integration "$smoke_test" \
            --locked -- --ignored --exact --nocapture
      - name: Verify Axum HTTP publication, retries and cold recovery against RustFS
        env:
          AWS_ACCESS_KEY_ID: cellule-ci
          AWS_SECRET_ACCESS_KEY: cellule-integration-fixture
          AWS_DEFAULT_REGION: us-east-1
          CELLULE_TEST_ENDPOINT: http://127.0.0.1:9000
          CELLULE_TEST_BUCKET: cellule-ci
          CELLULE_TEST_PREFIX: axum-http-smoke
        run: |
          cargo build -p cellule-axum --examples --locked
          python3 scripts/bench-axum-rustfs.py \
            --binary target/debug/examples/sql \
            --output "$RUNNER_TEMP/cellule-axum-http" \
            --repeats 1 --cells 1 4 --workers 4 --concurrency 1 4 \
            --warmup 4 --writes 8 --reads 16 \
            --read-driver target/debug/examples/http_load \
            --read-warmup-seconds 1 --read-seconds 2
      - name: Retain Axum HTTP verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellule-axum-http
          path: ${{ runner.temp }}/cellule-axum-http
          if-no-files-found: ignore
      - name: Test local LTX without replica
        run: cargo test -p cellule-ltx --no-default-features --locked
      - name: Test replica feature
        run: cargo test -p cellule-ltx --features replica --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Validate SQL and peer contracts
        run: node crates/cellule-runtime/docs/validate.mjs
      - name: Package the independent bootstrap crate
        run: cargo package -p cellule-types --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Check Rust 1.97 minimum
        run: cargo check --workspace --all-targets --all-features --locked
