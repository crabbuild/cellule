name: Reader publication diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build controlled reproducer
        run: cargo test -p cellule-app --test integration --all-features --locked --no-run
      - name: Retain every controlled interleaving
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/source.txt
          reader_test=host::replicas::pending_reader_activation_retains_a_new_publication_hint
          cargo test -p cellule-app --test integration --all-features --locked \
            "$reader_test" -- --exact --list > diagnostics/test-list.log
          rg -Fx "${reader_test}: test" diagnostics/test-list.log
          failed=0
          for attempt in 1 2 3 4 5 6; do
            if cargo test -p cellule-app --test integration --all-features --locked \
              "$reader_test" \
              -- --exact --nocapture > "diagnostics/run-$attempt.log" 2>&1; then
              echo "repeat $attempt passed"
            else
              failed=$((failed + 1))
              echo "repeat $attempt failed; log retained"
            fi
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reader-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: error
