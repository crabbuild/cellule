name: Paired Axum HTTP performance

on:
  workflow_call:
    inputs:
      baseline_ref:
        type: string
        required: true
      read_seconds:
        type: number
        default: 60
      workload:
        type: string
        default: reads
      write_seconds:
        type: number
        default: 120
      write_concurrency:
        type: number
        default: 16

permissions:
  contents: read

jobs:
  steady-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      rustfs:
        image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
        env:
          RUSTFS_ACCESS_KEY: cellule-ci
          RUSTFS_SECRET_KEY: cellule-integration-fixture
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOG_DIRECTORY: /data/logs
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/health/ready"
          --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0
      - name: Build both release servers before measuring
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
          WORKLOAD: ${{ inputs.workload }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/axum-evidence"
          baseline_commit=$(git rev-parse --verify --end-of-options "$BASELINE_REF^{commit}")
          git worktree add --detach "$RUNNER_TEMP/axum-baseline-source" "$baseline_commit"
          if [ "$WORKLOAD" = writes ]; then
            # Backport only phase observations and the example observer wiring.
            # Retain the exact diff so the baseline's instrumentation is auditable.
            patch="$GITHUB_WORKSPACE/scripts/axum-write-telemetry.patch"
            # The candidate may reorganize admission; this fixed fixture only
            # backports observations, never candidate scheduling changes.
            if git -C "$RUNNER_TEMP/axum-baseline-source" apply --check "$patch"; then
              git -C "$RUNNER_TEMP/axum-baseline-source" apply "$patch"
            elif git -C "$RUNNER_TEMP/axum-baseline-source" apply --reverse --check "$patch"; then
              :
            else
              # An instrumented baseline may have reorganized these files.
              # Accept it only when every patch target already matches the
              # candidate byte for byte; never copy candidate policy into it.
              git apply --numstat "$patch" > "$RUNNER_TEMP/axum-evidence/telemetry-targets.tsv"
              test -s "$RUNNER_TEMP/axum-evidence/telemetry-targets.tsv"
              while IFS=$'\t' read -r added removed target; do
                cmp "$GITHUB_WORKSPACE/$target" "$RUNNER_TEMP/axum-baseline-source/$target"
              done < "$RUNNER_TEMP/axum-evidence/telemetry-targets.tsv"
            fi
            cp crates/cellule-axum/examples/sql_metrics/mod.rs \
              "$RUNNER_TEMP/axum-baseline-source/crates/cellule-axum/examples/sql_metrics/mod.rs"
            cp "$patch" "$RUNNER_TEMP/axum-evidence/telemetry-backport.patch"
            git -C "$RUNNER_TEMP/axum-baseline-source" diff \
              > "$RUNNER_TEMP/axum-evidence/baseline-instrumentation.diff"
            sha256sum "$RUNNER_TEMP/axum-evidence/"*.patch \
              "$RUNNER_TEMP/axum-evidence/baseline-instrumentation.diff" \
              > "$RUNNER_TEMP/axum-evidence/instrumentation.sha256"
          fi
          printf '%s\n' "$baseline_commit" > "$RUNNER_TEMP/axum-evidence/baseline-revision.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/axum-evidence/candidate-revision.txt"
          uname -a > "$RUNNER_TEMP/axum-evidence/host.txt"
          lscpu > "$RUNNER_TEMP/axum-evidence/cpu.txt"
          rustc -Vv > "$RUNNER_TEMP/axum-evidence/rustc.txt"
          docker info --format '{{json .}}' > "$RUNNER_TEMP/axum-evidence/docker.json"
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/axum-baseline-source" <<'PY'
          import sys
          from pathlib import Path
          for directory in sys.argv[1:]:
              p = Path(directory) / "crates/cellule-axum/examples/sql.rs"
              s = p.read_text()
              start = s.index("async fn read_order(")
              pos = s.index(".await?;", start)
              probe = '.await.map_err(|error| { eprintln!("[DEBUG-write-read] {error:?}"); error })?;'
              p.write_text(s[:pos] + probe + s[pos + len(".await?;"):])
          PY
          git diff -- crates/cellule-axum/examples/sql.rs > "$RUNNER_TEMP/axum-evidence/candidate-instrumentation.diff"
          git -C "$RUNNER_TEMP/axum-baseline-source" diff > "$RUNNER_TEMP/axum-evidence/baseline-instrumentation.diff"
          sha256sum "$RUNNER_TEMP/axum-evidence/"*.patch "$RUNNER_TEMP/axum-evidence/"*.diff > "$RUNNER_TEMP/axum-evidence/instrumentation.sha256"
          CARGO_TARGET_DIR="$RUNNER_TEMP/axum-baseline-target" \
            cargo build --release -p cellule-axum --example sql --locked \
            --manifest-path "$RUNNER_TEMP/axum-baseline-source/Cargo.toml"
          CARGO_TARGET_DIR="$RUNNER_TEMP/axum-candidate-target" \
            cargo build --release -p cellule-axum --examples --locked
      - name: Measure paired steady HTTP and verify every Cell
        env:
          READ_SECONDS: ${{ inputs.read_seconds }}
          WRITE_SECONDS: ${{ inputs.write_seconds }}
          WRITE_CONCURRENCY: ${{ inputs.write_concurrency }}
          WORKLOAD: ${{ inputs.workload }}
          TOKIO_WORKER_THREADS: "4"
          RUSTFS_CONTAINER_ID: ${{ job.services.rustfs.id }}
          AWS_ACCESS_KEY_ID: cellule-ci
          AWS_SECRET_ACCESS_KEY: cellule-integration-fixture
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          CELLULE_TEST_ENDPOINT: http://127.0.0.1:9000
          CELLULE_TEST_BUCKET: cellule-axum-perf
          CELLULE_TEST_PREFIX: paired-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          concurrency=16
          case "$WORKLOAD" in
            reads)
              python3 -c 'import os; assert 30 <= int(os.environ["READ_SECONDS"]) <= 120'
              load_args=(--read-driver "$RUNNER_TEMP/axum-candidate-target/release/examples/http_load"
                --read-warmup-seconds 5 --read-seconds "$READ_SECONDS")
              ;;
            writes)
              python3 -c 'import os; assert 60 <= int(os.environ["WRITE_SECONDS"]) <= 180'
              python3 -c 'import os; assert int(os.environ["WRITE_CONCURRENCY"]) in (16, 64)'
              concurrency="$WRITE_CONCURRENCY"
              load_args=(--write-warmup-seconds 5 --write-seconds "$WRITE_SECONDS"
                --provider-container "$RUSTFS_CONTAINER_ID")
              ;;
            *) exit 1 ;;
          esac
          aws --endpoint-url "$CELLULE_TEST_ENDPOINT" s3api create-bucket --bucket "$CELLULE_TEST_BUCKET"
          python3 scripts/bench-axum-rustfs.py \
            --binary "$RUNNER_TEMP/axum-candidate-target/release/examples/sql" \
            --baseline-binary "$RUNNER_TEMP/axum-baseline-target/release/examples/sql" \
            --output "$RUNNER_TEMP/axum-evidence/results" \
            --repeats 3 --cells 1 4 16 --workers 4 --concurrency "$concurrency" \
            --warmup 16 --writes 32 --reads 64 \
            "${load_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: axum-steady-${{ inputs.workload }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/axum-evidence/
          if-no-files-found: error
          retention-days: 7
