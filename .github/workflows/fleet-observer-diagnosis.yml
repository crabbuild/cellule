name: Fleet executable reader maintenance diagnosis
on:
  push:
    branches: [codex/fleet-observer-diagnosis-ed16bf9]
permissions:
  contents: read
jobs:
  native-reader-maintenance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler sqlite3
      - name: Reader maintenance executable regression
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::reader_maintenance::tests:: --all-features --locked -- --nocapture --test-threads=1
      - name: Production reader command
        run: |
          cargo run -p cellule-host --example fleet_operations --all-features --locked -- maintenance-reader
      - name: Existing native reader fault cases
        if: always()
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::reader_tests::evacuation::tests:: --all-features --locked -- --nocapture --test-threads=1
      - name: Existing reader public observer contracts
        if: always()
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::reader_tests::evacuation::persisted::observation::reference_observer --all-features --locked -- --nocapture --test-threads=1
      - name: Existing follower observer contracts
        if: always()
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::follower_tests::persisted::observation:: --all-features --locked -- --nocapture --test-threads=1
      - name: Warning denied lint
        if: always()
        run: |
          cargo clippy -p cellule-host --all-targets --all-features --locked -- -D warnings
