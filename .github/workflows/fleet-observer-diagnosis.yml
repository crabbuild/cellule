name: Fleet role publication diagnosis
on:
  push:
    branches: [codex/fleet-observer-diagnosis-ed16bf9]
permissions:
  contents: read
jobs:
  native-role-restart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler sqlite3
      - name: Build native role harness
        run: |
          cargo test -p cellule-host --example fleet_operations --all-features --locked --no-run
      - name: Six controller and publication restart cases
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::follower_tests::persisted::restart:: --all-features --locked -- --nocapture --test-threads=1
      - name: Two cancelled original publication owners
        if: always()
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::follower_tests::persisted::cancelled_settlement:: --all-features --locked -- --nocapture --test-threads=1
      - name: Three unchanged observer contracts
        if: always()
        run: |
          cargo test -p cellule-host --example fleet_operations scenario::follower_tests::persisted::observation:: --all-features --locked -- --nocapture --test-threads=1
      - name: Physical action and resource retention
        if: always()
        run: |
          cargo test -p cellule-host --test node fleet_actions:: --all-features --locked -- --nocapture --test-threads=1
      - name: Opaque role binding refusals
        if: always()
        run: |
          cargo test -p cellule-host --lib fleet::reconciler::observation::role_settlement:: --all-features --locked -- --nocapture --test-threads=1
      - name: Warning denied lint
        if: always()
        run: |
          cargo clippy -p cellule-host --all-targets --all-features --locked -- -D warnings
