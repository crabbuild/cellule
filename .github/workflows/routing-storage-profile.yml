name: Routing storage diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2]
    steps:
      - name: Record devices and normal durable scratch writes
        run: |
          mkdir -p "$RUNNER_TEMP/storage-profile"
          df -hT > "$RUNNER_TEMP/storage-profile/filesystems.txt"
          lsblk --json --output NAME,TYPE,FSTYPE,SIZE,MOUNTPOINTS,ROTA,MODEL > "$RUNNER_TEMP/storage-profile/devices.json"
          lscpu --json > "$RUNNER_TEMP/storage-profile/cpu.json"
          mount > "$RUNNER_TEMP/storage-profile/mounts.txt"
          docker info --format '{{json .}}' > "$RUNNER_TEMP/storage-profile/docker.json"
          sudo mkdir -p /mnt/cellule-storage-profile
          sudo chown "$(id -u):$(id -g)" /mnt/cellule-storage-profile
          python3 - <<'PY'
          import json, os, tempfile, time
          from pathlib import Path
          roots = [Path(os.environ['RUNNER_TEMP']), Path('/mnt/cellule-storage-profile')]
          data = os.urandom(4096)
          rows = []
          for repeat in range(4):
              for root in roots if repeat % 2 == 0 else roots[::-1]:
                  with tempfile.TemporaryDirectory(dir=root) as temporary:
                      directory = Path(temporary)
                      parent = os.open(directory, os.O_RDONLY | os.O_DIRECTORY)
                      for index in range(128):
                          path = directory / str(index)
                          start = time.monotonic_ns()
                          with path.open('wb') as output:
                              output.write(data)
                              output.flush()
                              synced = time.monotonic_ns()
                              os.fsync(output.fileno())
                              file_end = time.monotonic_ns()
                          os.fsync(parent)
                          end = time.monotonic_ns()
                          rows.append(dict(root=str(root), device=os.stat(root).st_dev,
                                           repeat=repeat, file_fsync_ns=file_end-synced,
                                           parent_fsync_ns=end-file_end, total_ns=end-start))
                      os.close(parent)
          evidence = Path(os.environ['RUNNER_TEMP']) / 'storage-profile'
          (evidence / 'normal-fsync.json').write_text(json.dumps(rows, indent=2)+'\n')
          for root in roots:
              selected = [r['total_ns'] for r in rows if r['root']==str(root)]
              ordered = sorted(selected)
              print(root, 'device', os.stat(root).st_dev, 'p50/p95/p99 ms',
                    [ordered[(len(ordered)*q+99)//100-1]/1e6 for q in (50,95,99)])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: routing-storage-${{ matrix.host }}-${{ github.run_id }}
          path: ${{ runner.temp }}/storage-profile/
          if-no-files-found: error
          retention-days: 7
