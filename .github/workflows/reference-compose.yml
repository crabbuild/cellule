name: Serial forwarding diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      rustfs:
        image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
        env:
          RUSTFS_ACCESS_KEY: cellule-ci
          RUSTFS_SECRET_KEY: cellule-integration-fixture
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_OBS_LOG_DIRECTORY: /data/logs
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl --fail --silent http://127.0.0.1:9000/health/ready"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      AWS_ACCESS_KEY_ID: cellule-ci
      AWS_SECRET_ACCESS_KEY: cellule-integration-fixture
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      CELLULE_TEST_ENDPOINT: http://127.0.0.1:9000
      CELLULE_TEST_BUCKET: cellule-serial-diagnostic
      CELLULE_SERIAL_DIAGNOSTIC: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Pin source and prepare provider
        run: |
          mkdir -p diagnostics
          git rev-parse HEAD > diagnostics/source.txt
          rustc -Vv > diagnostics/rustc.txt
          uname -a > diagnostics/host.txt
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          aws --endpoint-url http://127.0.0.1:9000 s3api create-bucket --bucket cellule-serial-diagnostic
      - name: Compile one release binary
        run: |
          cargo test -p cellule-peer-http --lib --release --locked --no-run --message-format=json > diagnostics/build.jsonl
          python3 - <<'PYBUILD'
          import json, pathlib
          rows=[json.loads(x) for x in pathlib.Path('diagnostics/build.jsonl').read_text().splitlines()]
          bins={r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='cellule_peer_http'}
          assert len(bins)==1
          pathlib.Path('diagnostics/binary-path.txt').write_text(bins.pop())
          PYBUILD
          sha256sum "$(cat diagnostics/binary-path.txt)" > diagnostics/binary.sha256
      - name: Retain all three diagnostic repeats
        run: |
          binary=$(cat diagnostics/binary-path.txt)
          selector=performance_tests::rustfs_owner_routing_latency_throughput
          "$binary" "$selector" --ignored --exact --list > diagnostics/test-list.log
          grep -Fx "${selector}: test" diagnostics/test-list.log
          failed=0
          for repeat in 1 2 3; do
            mkdir -p "diagnostics/repeat-$repeat"
            export CELLULE_TEST_PREFIX="serial-diagnostic-${GITHUB_RUN_ID}-$repeat"
            export CELLULE_PERF_EVIDENCE="$PWD/diagnostics/repeat-$repeat"
            if "$binary" "$selector" --ignored --exact --nocapture > "diagnostics/repeat-$repeat/run.log" 2>&1; then
              sha256sum "$binary" > "diagnostics/repeat-$repeat/binary.sha256"
            else
              failed=$((failed + 1))
            fi
          done
          test "$failed" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cell-serial-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics
          if-no-files-found: error
          retention-days: 7
