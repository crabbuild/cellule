[workspace]
resolver = "3"
members = [
    "crates/cellule-types",
    "crates/cellule-store",
    "crates/cellule-ltx",
    "crates/cellule-runtime",
    "crates/cellule-app",
    "crates/cellule-host",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/crabbuild/cellule"
rust-version = "1.97"

[workspace.dependencies]
cellule-types = { version = "=0.1.0", path = "crates/cellule-types", default-features = false }
cellule-store = { version = "=0.1.0", path = "crates/cellule-store", default-features = false }
cellule-ltx = { version = "=0.1.0", path = "crates/cellule-ltx", default-features = false }
cellule-runtime = { version = "=0.1.0", path = "crates/cellule-runtime", default-features = false }
cellule-app = { version = "=0.1.0", path = "crates/cellule-app", default-features = false }
cellule-host = { version = "=0.1.0", path = "crates/cellule-host", default-features = false }
async-trait = "0.1"
blake3 = "1.8"
bytes = "1.11"
ed25519-dalek = "2.2"
futures-util = "0.3"
object_store = { version = "0.14.1", default-features = false }
prost = "0.13"
reqwest = { version = "0.12", default-features = false }
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2.0"
tokio = "1.49"
tokio-util = "0.7"
tracing = "0.1"
